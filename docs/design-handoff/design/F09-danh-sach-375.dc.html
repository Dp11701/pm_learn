<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Lộ trình · Danh sách · mobile</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 375px; height: 1800px; overflow: hidden; background: #F8FAFC; color: #0F172A; font-family: 'Be Vietnam Pro', Inter, system-ui, sans-serif; font-size: 15px; line-height: 24px">
  <header style="height: 56px; box-sizing: border-box; padding: 0 6px; display: flex; align-items: center; gap: 4px; background: #FFFFFF; border-bottom: 1px solid #E2E8F0">
    <button type="button" aria-label="Mở menu" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border: 0; background: transparent; color: #0F172A"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16"></path><path d="M4 12h16"></path><path d="M4 18h16"></path></svg></button>
    <h1 style="flex: 1; margin: 0; font-size: 17px; line-height: 28px; font-weight: 600">Lộ trình</h1>
    <button type="button" aria-label="Tìm kiếm" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border: 0; background: transparent; color: #0F172A"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path></svg></button>
    <button type="button" aria-label="Đồng hồ Risk Register 00:24:17" style="height: 44px; padding: 0 8px; border: 0; background: transparent"><span style="display: inline-flex; align-items: center; height: 28px; padding: 0 10px; border: 1px solid #8492A6; border-radius: 14px; font-family: 'JetBrains Mono', monospace; font-size: 13px; color: #0F172A">00:24:17</span></button>
  </header>

  <div style="padding: 12px 16px; display: flex; flex-direction: column; gap: 10px; background: #FFFFFF; border-bottom: 1px solid #E2E8F0">
    <div style="display: flex; gap: 8px; overflow-x: auto">
      <button type="button" style="flex: none; display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 6px 0 12px; border: 1.5px solid #0F172A; border-radius: 6px; background: #F1F5F9; color: #0F172A; font: 600 13px/20px 'Be Vietnam Pro', sans-serif">Đang học, Cần ôn lại<span style="width: 28px; height: 28px; display: flex; align-items: center; justify-content: center"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg></span></button>
      <button type="button" style="flex: none; display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 12px; border: 1px solid #8492A6; border-radius: 6px; background: #FFFFFF; color: #0F172A; font: 500 13px/20px 'Be Vietnam Pro', sans-serif"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><line x1="21" x2="3" y1="6" y2="6"></line><line x1="17" x2="7" y1="12" y2="12"></line><line x1="13" x2="11" y1="18" y2="18"></line></svg>Bộ lọc khác</button>
    </div>
    <div style="display: flex; justify-content: space-between; align-items: center; font-size: 13px; line-height: 20px"><span aria-live="polite" style="color: #475569">Đang hiển thị 9/199 mục</span><button type="button" style="height: 36px; padding: 0 4px; border: 0; background: transparent; color: #0F172A; text-decoration: underline; font: 500 13px/20px 'Be Vietnam Pro', sans-serif">Xoá bộ lọc</button></div>
  </div>

  <div role="tree" aria-label="Cây roadmap đã lọc" style="display: flex; flex-direction: column">
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="18">
      <sc-if value="{{r.isPart}}" hint-placeholder-val="{{false}}">
        <button type="button" aria-expanded="true" style="display: flex; align-items: center; gap: 10px; min-height: 52px; padding: 8px 16px; border: 0; border-bottom: 1px solid #E2E8F0; background: #F1F5F9; color: #0F172A; font: 600 15px/24px 'Be Vietnam Pro', sans-serif; text-align: left">
          <span lang="en" style="flex: 1">{{r.name}}</span><span style="font-size: 13px; font-weight: 500; color: #475569; font-variant-numeric: tabular-nums">{{r.frac}}</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m18 15-6-6-6 6"></path></svg>
        </button>
      </sc-if>
      <sc-if value="{{r.isSub}}" hint-placeholder-val="{{false}}">
        <div style="display: flex; align-items: center; gap: 8px; padding: 10px 16px 4px; font-size: 13px; line-height: 20px; color: #475569">
          <span lang="en" style="flex: 1">{{r.name}}</span><span style="font-variant-numeric: tabular-nums">{{r.frac}}</span>
        </div>
      </sc-if>
      <sc-if value="{{r.item}}" hint-placeholder-val="{{true}}">
        <a href="#" role="treeitem" style="display: flex; flex-direction: column; gap: 6px; min-height: 48px; padding: 10px 16px 10px 12px; border-left: 4px solid {{r.bar}}; border-bottom: 1px solid #E2E8F0; background: #FFFFFF; color: #0F172A; text-decoration: none">
          <span style="display: flex; align-items: flex-start; gap: 8px">
            <sc-if value="{{r.doc}}" hint-placeholder-val="{{false}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#172554" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Tài liệu" style="flex: none; margin-top: 4px"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"></path><path d="M14 2v4a2 2 0 0 0 2 2h4"></path><path d="M10 9H8"></path><path d="M16 13H8"></path></svg></sc-if>
            <span lang="en" style="flex: 1; font-weight: 600">{{r.name}}</span>
          </span>
          <span style="display: flex; flex-wrap: wrap; align-items: center; gap: 6px">
            <span style="display: inline-flex; align-items: center; height: 24px; padding: 0 8px; border-radius: 6px; background: {{r.pillBg}}; color: {{r.pillFg}}; font-size: 12px; line-height: 18px; font-weight: 600">{{r.status}}</span>
            <sc-if value="{{r.review}}" hint-placeholder-val="{{false}}"><span style="display: inline-flex; align-items: center; height: 24px; padding: 0 8px; border-radius: 6px; background: #CCFBF1; color: #115E59; font-size: 12px; line-height: 18px; font-weight: 600">↺ Cần ôn lại</span></sc-if>
            <span style="display: inline-flex; align-items: center; height: 24px; padding: 0 8px; border-radius: 6px; border: {{r.cBd}}; color: {{r.cFg}}; font-size: 12px; line-height: 18px; font-weight: 600">{{r.content}}</span>
          </span>
        </a>
      </sc-if>
    </sc-for>
  </div>
  <p style="margin: 0; padding: 16px; font-size: 13px; line-height: 20px; color: #475569">Chạm giữ một mục để mở sheet đổi trạng thái. Bản đồ trên mobile sẽ có sau.</p>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":375,"height":1800}}'>
class Component extends DCLogic {
  renderVals() {
    function part(name, frac) { return { isPart: true, name: name, frac: frac }; }
    function sub(name, frac) { return { isSub: true, name: name, frac: frac }; }
    function item(name, st, ct, opts) {
      opts = opts || {};
      var lr = st === 'lr';
      var c = { ok: ['Đã duyệt', '1px solid #E2E8F0', '#0F172A'], draft: ['Bản nháp · AI', '1px solid #E2E8F0', '#0F172A'], none: ['Chưa có nội dung', '1px dashed #8492A6', '#475569'] }[ct];
      return { item: true, name: name, doc: !!opts.doc, review: !!opts.review, status: lr ? 'Đang học' : 'Đã xong',
        pillBg: lr ? '#F3E8FF' : '#DCFCE7', pillFg: lr ? '#6B21A8' : '#166534', bar: lr ? '#7E22CE' : '#15803D',
        content: c[0], cBd: c[1], cFg: c[2] };
    }
    var rows = [
      part('Project Management', '28/142 · 2 bỏ qua'),
      sub('PM Framework / Approach', '12/22'),
      item('Scrum', 'dn', 'ok', { review: true }),
      sub('Scope Management', '5/16'),
      item('Scope Creep', 'lr', 'ok'),
      item('Definition of Done', 'dn', 'ok', { review: true }),
      sub('Scope Management › Prioritization Techniques', '1/6'),
      item('MoSCoW', 'dn', 'ok', { review: true }),
      sub('Schedule Management', '3/14 · 2 bỏ qua'),
      item('Schedule creation (milestones, phases, critical path)', 'lr', 'draft'),
      sub('Risk Management', '0/10'),
      item('Risk Register', 'lr', 'draft', { doc: true }),
      item('Qualitative Risk Assessment', 'lr', 'draft'),
      sub('Stakeholder and Communication Management', '0/9'),
      item('Power/Interest Grid', 'lr', 'draft'),
      part('Tools', '1/10 · 2 bỏ qua'),
      sub('Task Management', '0/4'),
      item('Jira', 'lr', 'none')
    ];
    return { rows: rows };
  }
}
</script>
</body>
</html>
