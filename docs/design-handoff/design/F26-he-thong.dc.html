<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Trạng thái hệ thống</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1440px; height: 1500px; overflow: hidden; box-sizing: border-box; padding: 56px 80px; display: flex; flex-direction: column; gap: 32px; background: #E2E8F0; color: #0F172A; font-family: 'Be Vietnam Pro', Inter, system-ui, sans-serif; font-size: 15px; line-height: 24px">
  <h1 style="margin: 0; font-size: 28px; line-height: 40px; font-weight: 700">F26 · Trạng thái hệ thống</h1>
  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 32px">

    <figure style="margin: 0; display: flex; flex-direction: column; gap: 10px">
      <figcaption style="font-size: 13px; line-height: 20px; font-weight: 600; color: #475569">404 · /hoc/scope-creap</figcaption>
      <div style="height: 400px; box-sizing: border-box; padding: 48px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; text-align: center; background: #F8FAFC; border: 1px solid #CBD5E1; border-radius: 14px">
        <span style="font-family: 'JetBrains Mono', monospace; font-size: 13px; color: #475569">/hoc/scope-creap</span>
        <h2 tabindex="-1" style="margin: 0; font-size: 22px; line-height: 32px; font-weight: 700">Không tìm thấy trang này.</h2>
        <p style="margin: 0">Có phải bạn muốn mở <a href="#" lang="en" style="color: #0F172A; font-weight: 600">Scope Creep</a>?</p>
        <label style="width: 100%; max-width: 400px; display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 12px; box-sizing: border-box; border: 1px solid #8492A6; border-radius: 6px; background: #FFFFFF; color: #475569"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path></svg><span style="position: absolute; left: -9999px">Tìm mục</span><input placeholder="Tìm trong 199 mục…" style="flex: 1; border: 0; outline: 0; background: transparent; font: 400 15px/24px 'Be Vietnam Pro', sans-serif"></label>
        <a href="#" style="font-size: 13px; color: #0F172A">Về Tổng quan</a>
      </div>
    </figure>

    <figure style="margin: 0; display: flex; flex-direction: column; gap: 10px">
      <figcaption style="font-size: 13px; line-height: 20px; font-weight: 600; color: #475569">Lỗi trang</figcaption>
      <div style="height: 400px; box-sizing: border-box; padding: 48px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; text-align: center; background: #F8FAFC; border: 1px solid #CBD5E1; border-radius: 14px">
        <span style="width: 40px; height: 40px; border-radius: 50%; background: #F1F5F9; display: flex; align-items: center; justify-content: center; color: #B91C1C"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><line x1="12" x2="12" y1="8" y2="12"></line><line x1="12" x2="12.01" y1="16" y2="16"></line></svg></span>
        <h2 style="margin: 0; font-size: 22px; line-height: 32px; font-weight: 700">Trang này gặp lỗi khi hiển thị.</h2>
        <p style="margin: 0; color: #475569">Dữ liệu học của bạn không bị ảnh hưởng.</p>
        <div style="display: flex; gap: 8px"><button type="button" style="height: 40px; padding: 0 16px; border: 0; border-radius: 6px; background: #0F172A; color: #FFFFFF; font: 600 15px/24px 'Be Vietnam Pro', sans-serif">Tải lại</button><button type="button" aria-expanded="true" style="height: 40px; padding: 0 14px; border: 1px solid #8492A6; border-radius: 6px; background: #FFFFFF; color: #0F172A; font: 500 15px/24px 'Be Vietnam Pro', sans-serif">Chi tiết lỗi ▴</button></div>
        <pre style="margin: 0; width: 100%; max-width: 440px; box-sizing: border-box; padding: 10px 12px; border: 1px solid #E2E8F0; border-radius: 6px; background: #FFFFFF; font-family: 'JetBrains Mono', monospace; font-size: 12px; line-height: 18px; text-align: left; color: #475569; white-space: pre-wrap">[Chi tiết lỗi mẫu — thông báo kỹ thuật, 1–3 dòng]</pre>
      </div>
    </figure>

    <figure style="margin: 0; display: flex; flex-direction: column; gap: 10px">
      <figcaption style="font-size: 13px; line-height: 20px; font-weight: 600; color: #475569">Lỗi đọc file · trong trang bài học</figcaption>
      <div style="box-sizing: border-box; padding: 24px; display: flex; flex-direction: column; gap: 16px; background: #F8FAFC; border: 1px solid #CBD5E1; border-radius: 14px">
        <h2 lang="en" style="margin: 0; font-size: 22px; line-height: 32px; font-weight: 700">Change log</h2>
        <div role="alert" style="display: flex; flex-wrap: wrap; gap: 12px; align-items: center; padding: 16px; border: 1px solid #B91C1C; border-radius: 10px; background: #F1F5F9">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#B91C1C" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><line x1="12" x2="12" y1="8" y2="12"></line><line x1="12" x2="12.01" y1="16" y2="16"></line></svg>
          <div style="flex: 1 1 260px; display: flex; flex-direction: column"><strong style="font-weight: 600; color: #B91C1C"><span style="font-family: 'JetBrains Mono', monospace">change-log.md</span>: lỗi frontmatter dòng 3</strong><span style="font-size: 13px; line-height: 20px; color: #475569">Bài vẫn hiện trạng thái học, đồng hồ và ghi chú.</span></div>
          <a href="#" style="display: inline-flex; align-items: center; height: 36px; padding: 0 14px; border: 1px solid #8492A6; border-radius: 6px; background: #FFFFFF; color: #0F172A; text-decoration: none; font-weight: 500">Mở trong trình soạn</a>
        </div>
      </div>

      <figcaption style="margin-top: 22px; font-size: 13px; line-height: 20px; font-weight: 600; color: #475569">Mất kết nối máy chủ cục bộ · banner dính đầu trang</figcaption>
      <div role="alert" style="display: flex; flex-wrap: wrap; gap: 12px; align-items: center; padding: 14px 16px; border: 1px solid #B91C1C; border-radius: 10px; background: #F1F5F9">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#B91C1C" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h.01"></path><path d="M8.5 16.429a5 5 0 0 1 7 0"></path><path d="M5 12.859a10 10 0 0 1 5.17-2.69"></path><path d="M19 12.859a10 10 0 0 0-2.007-1.523"></path><path d="M2 8.82a15 15 0 0 1 4.177-2.643"></path><path d="M22 8.82a15 15 0 0 0-11.288-3.764"></path><path d="m2 2 20 20"></path></svg>
        <div style="flex: 1 1 280px; display: flex; flex-direction: column"><strong style="font-weight: 600; color: #B91C1C">Mất kết nối với máy chủ cục bộ.</strong><span aria-live="polite" style="font-size: 13px; line-height: 20px; color: #475569">Tự thử lại sau 5 giây… Nội dung đang gõ được giữ nguyên.</span></div>
        <button type="button" style="height: 36px; padding: 0 14px; border: 1px solid #8492A6; border-radius: 6px; background: #FFFFFF; color: #0F172A; font: 500 15px/24px 'Be Vietnam Pro', sans-serif">Thử ngay</button>
      </div>
    </figure>

    <figure style="margin: 0; display: flex; flex-direction: column; gap: 10px">
      <figcaption style="font-size: 13px; line-height: 20px; font-weight: 600; color: #475569">Skeleton · Tổng quan đang tải</figcaption>
      <div aria-busy="true" aria-label="Đang tải" style="box-sizing: border-box; padding: 24px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; background: #F8FAFC; border: 1px solid #CBD5E1; border-radius: 14px">
        <sc-for list="{{sk}}" as="s" hint-placeholder-count="4">
          <div style="height: {{s.h}}; box-sizing: border-box; padding: 16px; display: flex; flex-direction: column; gap: 10px; background: #FFFFFF; border: 1px solid #E2E8F0; border-radius: 10px; grid-column: {{s.col}}">
            <span style="width: 40%; height: 12px; border-radius: 4px; background: #F1F5F9"></span>
            <span style="width: 70%; height: 20px; border-radius: 4px; background: #F1F5F9"></span>
            <span style="width: 90%; height: 12px; border-radius: 4px; background: #F1F5F9"></span>
            <span style="width: 60%; height: 12px; border-radius: 4px; background: #F1F5F9"></span>
          </div>
        </sc-for>
      </div>
      <span style="font-size: 13px; line-height: 20px; color: #475569">Skeleton từng card; card nào lỗi thì chỉ card đó báo lỗi + Thử lại. Với prefers-reduced-motion: không nhấp nháy.</span>
    </figure>

    <figure style="margin: 0; display: flex; flex-direction: column; gap: 10px; grid-column: 1 / -1">
      <figcaption style="font-size: 13px; line-height: 20px; font-weight: 600; color: #475569">Toast · góc dưới trái, aria-live</figcaption>
      <div style="display: flex; gap: 24px">
        <div role="status" style="display: flex; align-items: center; gap: 16px; padding: 12px 16px; border-radius: 10px; background: #0F172A; color: #FFFFFF; box-shadow: 0 8px 24px rgba(15,23,42,.12)"><span>Đã chuyển <span lang="en">Scope Creep</span> sang Đã xong</span><button type="button" style="height: 32px; padding: 0 10px; border: 1px solid #FFFFFF; border-radius: 6px; background: transparent; color: #FFFFFF; font: 600 13px/20px 'Be Vietnam Pro', sans-serif">Hoàn tác</button></div>
        <div role="alert" style="display: flex; align-items: center; gap: 16px; padding: 12px 16px; border-radius: 10px; background: #FFFFFF; border: 1.5px solid #B91C1C; box-shadow: 0 8px 24px rgba(15,23,42,.12)"><span style="color: #B91C1C; font-weight: 600">Lỗi lưu</span><button type="button" style="height: 32px; padding: 0 10px; border: 1px solid #8492A6; border-radius: 6px; background: #FFFFFF; color: #0F172A; font: 600 13px/20px 'Be Vietnam Pro', sans-serif">Thử lại</button></div>
      </div>
    </figure>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1500}}'>
class Component extends DCLogic {
  renderVals() {
    return { sk: [{ h: '180px', col: 'auto' }, { h: '180px', col: 'auto' }, { h: '140px', col: '1 / -1' }, { h: '120px', col: 'auto' }] };
  }
}
</script>
</body>
</html>
